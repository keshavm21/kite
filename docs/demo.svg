<text x="394.0" y="18" fill="#8b949e" font-family="monospace" font-size="12" text-anchor="middle">kitec</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve">
<g class="a0">
<text x="16" y="64" fill="#3fb950">$&#160;kitec&#160;examples/row_sum.kite&#160;-O1&#160;--emit=ir</text></g>
<g class="a1">
<text x="16" y="82" fill="#c9d1d9">kernel&#160;@row_sum(i32&#160;%rows.0,&#160;i32&#160;%cols.1,&#160;ptr.f32&#160;%m.2,&#160;ptr.f32&#160;%out.3)&#160;{</text></g>
<g class="a2">
<text x="16" y="100" fill="#c9d1d9">entry:</text></g>
<g class="a3">
<text x="16" y="118" fill="#c9d1d9">&#160;&#160;%4&#160;=&#160;special&#160;i32&#160;ctaid.x</text></g>
<g class="a4">
<text x="16" y="136" fill="#c9d1d9">&#160;&#160;%5&#160;=&#160;special&#160;i32&#160;ntid.x</text></g>
<g class="a5">
<text x="16" y="154" fill="#c9d1d9">&#160;&#160;%6&#160;=&#160;mul&#160;i32&#160;%4,&#160;%5</text></g>
<g class="a6">
<text x="16" y="172" fill="#c9d1d9">&#160;&#160;%7&#160;=&#160;special&#160;i32&#160;tid.x</text></g>
<g class="a7">
<text x="16" y="190" fill="#c9d1d9">&#160;&#160;%8&#160;=&#160;add&#160;i32&#160;%6,&#160;%7</text></g>
<g class="a8">
<text x="16" y="208" fill="#c9d1d9">&#160;&#160;%10&#160;=&#160;ge&#160;i32&#160;%8,&#160;%rows.0</text></g>
<g class="a9">
<text x="16" y="226" fill="#c9d1d9">&#160;&#160;br&#160;%10,&#160;if.then.1,&#160;if.end.2</text></g>
<g class="a10">
<text x="16" y="244" fill="#c9d1d9">if.then.1:</text></g>
<g class="a11">
<text x="16" y="262" fill="#c9d1d9">&#160;&#160;ret</text></g>
<g class="a12">
<text x="16" y="280" fill="#c9d1d9">if.end.2:</text></g>
<g class="a13">
<rect x="12" y="285" width="764" height="18" fill="#f2cc60" fill-opacity="0.12"/>
<text x="16" y="298" fill="#f2cc60">&#160;&#160;%14&#160;=&#160;mul&#160;i32&#160;%8,&#160;%cols.1&#160;&#160;&#160;;&#160;hoisted&#160;out&#160;of&#160;the&#160;loop&#160;by&#160;licm</text></g>
<g class="a14">
<text x="16" y="316" fill="#c9d1d9">&#160;&#160;%acc.21&#160;=&#160;copy&#160;f32&#160;0.0</text></g>
<g class="a15">
<text x="16" y="334" fill="#c9d1d9">&#160;&#160;%c.22&#160;=&#160;copy&#160;i32&#160;0</text></g>
<g class="a16">
<text x="16" y="352" fill="#c9d1d9">&#160;&#160;jmp&#160;for.cond.3</text></g>
<g class="a17">
<text x="16" y="370" fill="#c9d1d9">for.cond.3:</text></g>
<g class="a18">
<text x="16" y="388" fill="#c9d1d9">&#160;&#160;%13&#160;=&#160;lt&#160;i32&#160;%c.22,&#160;%cols.1</text></g>
<g class="a19">
<text x="16" y="406" fill="#c9d1d9">&#160;&#160;br&#160;%13,&#160;for.body.4,&#160;for.end.6</text></g>
<g class="a20">
<text x="16" y="424" fill="#c9d1d9">for.body.4:</text></g>
<g class="a21">
<text x="16" y="442" fill="#c9d1d9">&#160;&#160;%15&#160;=&#160;add&#160;i32&#160;%14,&#160;%c.22</text></g>
<g class="a22">
<text x="16" y="460" fill="#c9d1d9">&#160;&#160;%16&#160;=&#160;load&#160;f32&#160;global&#160;%m.2[%15]</text></g>
<g class="a23">
<text x="16" y="478" fill="#c9d1d9">&#160;&#160;%17&#160;=&#160;add&#160;f32&#160;%acc.21,&#160;%16</text></g>
<g class="a24">
<text x="16" y="496" fill="#c9d1d9">&#160;&#160;%18&#160;=&#160;add&#160;i32&#160;%c.22,&#160;1</text></g>
<g class="a25">
<text x="16" y="514" fill="#c9d1d9">&#160;&#160;%acc.21&#160;=&#160;copy&#160;f32&#160;%17</text></g>
<g class="a26">
<text x="16" y="532" fill="#c9d1d9">&#160;&#160;%c.22&#160;=&#160;copy&#160;i32&#160;%18</text></g>
<g class="a27">
<text x="16" y="550" fill="#c9d1d9">&#160;&#160;jmp&#160;for.cond.3</text></g>
<g class="a28">
<text x="16" y="568" fill="#c9d1d9">for.end.6:</text></g>
<g class="a29">
<text x="16" y="586" fill="#c9d1d9">&#160;&#160;store&#160;f32&#160;global&#160;%out.3[%8],&#160;%acc.21</text></g>
<g class="a30">
<text x="16" y="604" fill="#c9d1d9">&#160;&#160;ret</text></g>
<g class="a31">
<text x="16" y="622" fill="#c9d1d9">}</text></g>
<g class="a32">
<text x="16" y="640" fill="#c9d1d9"></text></g>
<g class="a33">
<text x="16" y="658" fill="#3fb950">$&#160;kitec&#160;run&#160;examples/row_sum.kite&#160;-O0</text></g>
<g class="a34">
<text x="16" y="676" fill="#c9d1d9">out:&#160;1.37470174&#160;2.37554216&#160;6.71610737&#160;-5.27311182&#160;-3.19571805&#160;-1.10151827&#160;1.7621897…</text></g>
<g class="a35">
<text x="16" y="694" fill="#c9d1d9"></text></g>
<g class="a36">
<text x="16" y="712" fill="#3fb950">$&#160;kitec&#160;run&#160;examples/row_sum.kite&#160;-O1</text></g>
<g class="a37">
<text x="16" y="730" fill="#c9d1d9">out:&#160;1.37470174&#160;2.37554216&#160;6.71610737&#160;-5.27311182&#160;-3.19571805&#160;-1.10151827&#160;1.7621897…</text></g>
</g>
